# The LEGACY-VOCABULARY fixture (audit Tier-1 #3, owner ruling 2026-08-03):
# the dev_7-3 operator table, verbatim, with no rules and no asset dependence.
#
# WHY IT EXISTS: the retired hyper-operator vocabulary (mult2..5, div2..5,
# pow2..5, pow1_2..pow1_5) remains a supported INPUT language for tables that
# declare it -- the conversion layer's desugaring, rendering and chain-combining
# behavior over that vocabulary is live, tested functionality. Those tests used
# to load the dev_7-3 HF asset from ~/.cache; this fixture carries the SAME
# operator table in-repo, so the suites depend on no legacy asset. It is
# consumed by RAW construction (python) / Engine::from_strs (rust) only -- the
# public artifact-loading boundary refuses generation-1 configs (simplipy.compat),
# and this file deliberately never travels through it.
operators:
  +:
    realization: +
    alias: []
    inverse: '-'
    arity: 2
    precedence: 1
    commutative: true
  '-':
    realization: '-'
    alias: []
    inverse: +
    arity: 2
    precedence: 1
    commutative: false
  neg:
    realization: simplipy.operators.neg
    alias: []
    inverse: neg
    arity: 1
    precedence: 2.5
    commutative: false
  '*':
    realization: '*'
    alias: []
    inverse: /
    arity: 2
    precedence: 2
    commutative: true
  /:
    realization: simplipy.operators.div
