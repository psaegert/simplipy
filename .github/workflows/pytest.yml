on:
  push:
    branches: main
  pull_request:

name: pytest

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          lfs: false

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      # Rust toolchain: the inline core (simplipy._core) is compiled by maturin during the editable
      # install below.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Install the package and development requirements. maturin (PEP 660) builds + installs the Rust
      # extension for the editable install.
      - name: Install package and development requirements
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      # The artifact-compat suite exercises the generation gate against the REAL
      # published legacy artifact: load-refusal on its config, and the deliberately
      # OPEN management boundary (get_path resolves it without loading). Stage the
      # full 4-3 asset as that suite's test input -- it is never loaded as an engine.
      - name: Stage the legacy 4-3 asset (generation-gate refusal + management tests)
        run: |
          python - <<'PY'
          import json, os
          from huggingface_hub import hf_hub_download
          manifest = json.load(open(hf_hub_download("psaegert/simplipy-assets", "manifest.json", repo_type="dataset")))
          info = manifest["4-3"]
          cache = os.path.expanduser("~/.cache/simplipy")
          for f in info["files"]:
              hf_hub_download(repo_id=info["repo_id"], filename=f"{info['directory']}/{f}", repo_type="dataset", local_dir=cache)
          print("staged legacy 4-3 ->", os.path.join(cache, info["directory"]))
          PY

      # The engine suites load the SERVED acj-4-3 asset from the cache, exactly like a
      # user install (the tree carries no artifact copy).
      - name: Stage the acj-4-3 engine asset (the asset-gated suites load it)
        run: |
          python - <<'PY'
          import json, os
          from huggingface_hub import hf_hub_download
          manifest = json.load(open(hf_hub_download("psaegert/simplipy-assets", "manifest.json", repo_type="dataset")))
          info = manifest["acj-4-3"]
          cache = os.path.expanduser("~/.cache/simplipy")
          for f in info["files"]:
              hf_hub_download(repo_id=info["repo_id"], filename=f"{info['directory']}/{f}", repo_type="dataset", local_dir=cache)
          print("staged acj-4-3 ->", os.path.join(cache, info["directory"]))
          PY

      # REQUIRE_ASSETS: the asset-gated python tests (the staged acj-4-3 engine and the
      # staged legacy refusal input above) must FAIL loudly if the assets vanish, never
      # silently skip.
      - name: Run tests
        run: pytest tests
        env:
          SIMPLIPY_TEST_REQUIRE_ASSETS: "1"

  rust-checks:
    name: Rust (fmt / clippy / test / deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Stage the acj-4-3 engine asset (the cargo asset-gated tests load it)
        # The generation-2 test universe (audit Tier-1 #3): the rust suite runs on the
        # engine the package actually serves. No legacy asset is staged anywhere in CI;
        # the legacy-vocabulary tests use the in-repo fixture (tests/fixtures/).
        run: |
          python -m pip install --quiet huggingface_hub
          python - <<'PY'
          import json, os
          from huggingface_hub import hf_hub_download
          manifest = json.load(open(hf_hub_download("psaegert/simplipy-assets", "manifest.json", repo_type="dataset")))
          info = manifest["acj-4-3"]
          cache = os.path.expanduser("~/.cache/simplipy")
          for f in info["files"]:
              hf_hub_download(repo_id=info["repo_id"], filename=f"{info['directory']}/{f}", repo_type="dataset", local_dir=cache)
          print("staged acj-4-3 ->", os.path.join(cache, info["directory"]))
          PY
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --lib --all-features
      # REQUIRE_ASSETS: ~half the Rust suite is gated on this asset and self-skips (green, no-op)
      # when it is absent -- so a silently broken staging step would thin the suite to nothing.
      # With the variable set, a missing asset panics the gated tests instead.
      - name: cargo test (asset staged above, and required loudly)
        run: cargo test --lib
        env:
          SIMPLIPY_TEST_REQUIRE_ASSETS: "1"
      - name: cargo-deny (supply-chain / license / advisory gate)
        uses: EmbarkStudios/cargo-deny-action@v2
