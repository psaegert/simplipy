on:
  push:
    branches: [main, "release/**"]
  pull_request:

name: pytest

jobs:
  pytest:
    runs-on: ubuntu-latest
    # A hung job runs to GitHub's 6h default, so the job carries its own bound. The
    # suite takes about 13 minutes on a development host (the shipped-triple sweep of
    # the permissive-dominance gate alone about 5); 60 minutes leaves room for a slower
    # runner and still bounds a hang.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          lfs: false

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      # Rust toolchain: the inline core (simplipy._core) is compiled by maturin during the editable
      # install below.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Install the package and development requirements. maturin (PEP 660) builds + installs the Rust
      # extension for the editable install.
      - name: Install package and development requirements
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      # Recorded per job so the resolved numeric stack is a fact in the log, never an
      # assumption (the 3.11-era divergence this caught is resolved: D35 moved the
      # floor to >=3.12, matching the dependency reality).
      - name: Record the resolved numeric stack
        run: |
          python - <<'PY'
          import sys, importlib.metadata as md
          print('python', sys.version.split()[0])
          for pkg in ('numpy', 'scipy', 'mpmath', 'huggingface_hub'):
              print(f'  {pkg} {md.version(pkg)}')
          PY

      # The artifact-compat suite exercises the generation gate against the REAL
      # published legacy artifact: load-refusal on its config, and the deliberately
      # OPEN management boundary (get_path resolves it without loading). Stage the
      # full 4-3 asset as that suite's test input -- it is never loaded as an engine.
      - name: Stage the legacy 4-3 asset (generation-gate refusal + management tests)
        run: |
          python - <<'PY'
          import json, os
          from huggingface_hub import hf_hub_download
          manifest = json.load(open(hf_hub_download("psaegert/simplipy-assets", "manifest.json", repo_type="dataset")))
          info = manifest["4-3"]
          cache = os.path.expanduser("~/.cache/simplipy")
          for f in info["files"]:
              hf_hub_download(repo_id=info["repo_id"], filename=f"{info['directory']}/{f}", repo_type="dataset", local_dir=cache)
          print("staged legacy 4-3 ->", os.path.join(cache, info["directory"]))
          PY

      # The engine suites load the acj-4 cell the tree carries under assets/engines/, and
      # the staged cache copy where the tree has none (tests/conftest.py, acj_asset_dir).
      - name: Stage the acj-4 and acj-4-3 engine assets (the asset-gated suites load them)
        run: |
          python - <<'PY'
          import json, os
          from huggingface_hub import hf_hub_download
          manifest = json.load(open(hf_hub_download("psaegert/simplipy-assets", "manifest.json", repo_type="dataset")))
          cache = os.path.expanduser("~/.cache/simplipy")
          for name in ("acj-4", "acj-4-3"):
              info = manifest[name]
              for f in info["files"]:
                  hf_hub_download(repo_id=info["repo_id"], filename=f"{info['directory']}/{f}", repo_type="dataset", local_dir=cache)
              print("staged", name, "->", os.path.join(cache, info["directory"]))
          PY

      # REQUIRE_ASSETS: the asset-gated python tests (the acj-4 triple and the staged
      # legacy refusal input above) must FAIL loudly if an asset vanishes, never
      # silently skip.
      - name: Run tests
        run: pytest tests
        env:
          SIMPLIPY_TEST_REQUIRE_ASSETS: "1"

  # THE RELEASE GATES ON THE BUILT WHEEL. The job above tests an editable install, which
  # reads the package from src/ and so cannot see a file the wheel leaves out. This job
  # builds the wheel, installs it into a fresh venv, and runs the release-gate suites
  # from a directory holding only tests/ and assets/ (no src/), so the package under test
  # is the wheel's. A packaging regression -- such as the gate's corpus missing from the
  # wheel -- fails here.
  wheel-gates:
    name: Release gates on the built wheel
    runs-on: ubuntu-latest
    # A release build of the core plus the gate suites; the shipped-triple sweep alone
    # takes about 5 minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          lfs: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip
          pip wheel --no-deps -w dist .
          python -m zipfile -l dist/simplipy-*.whl | grep simplipy/verify/data/raw_skeletons_nv.json
      - name: Install the wheel into a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/wheelenv"
          "$RUNNER_TEMP/wheelenv/bin/pip" install dist/simplipy-*.whl pytest
      - name: Stage the legacy 4-3 asset (the generation-gate refusal tests read it)
        run: |
          "$RUNNER_TEMP/wheelenv/bin/python" - <<'PY'
          import json, os
          from huggingface_hub import hf_hub_download
          manifest = json.load(open(hf_hub_download("psaegert/simplipy-assets", "manifest.json", repo_type="dataset")))
          info = manifest["4-3"]
          cache = os.path.expanduser("~/.cache/simplipy")
          for f in info["files"]:
              hf_hub_download(repo_id=info["repo_id"], filename=f"{info['directory']}/{f}", repo_type="dataset", local_dir=cache)
          PY
      - name: Run the release-gate suites outside the source tree
        run: |
          OUTSIDE="$RUNNER_TEMP/outside"
          mkdir -p "$OUTSIDE"
          cp -r tests assets "$OUTSIDE/"
          cd "$OUTSIDE"
          "$RUNNER_TEMP/wheelenv/bin/python" -c "import simplipy, sys; print(simplipy.__file__); sys.exit('wheelenv' not in simplipy.__file__)"
          "$RUNNER_TEMP/wheelenv/bin/python" -m pytest -p no:cacheprovider \
            tests/test_verify.py tests/test_artifact_compat.py tests/test_mode_rulesets.py \
            tests/test_rules_less_warning.py
        env:
          SIMPLIPY_TEST_REQUIRE_ASSETS: "1"

  rust-checks:
    name: Rust (fmt / clippy / test / deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stage the acj-4 engine asset (the cargo asset-gated tests load it)
        # The generation-2 test universe (audit Tier-1 #3): the rust suite runs on the
        # engine the package actually serves. No legacy asset is staged anywhere in CI;
        # the legacy-vocabulary tests use the in-repo fixture (tests/fixtures/).
        run: |
          python -m pip install --quiet huggingface_hub
          python - <<'PY'
          import json, os
          from huggingface_hub import hf_hub_download
          manifest = json.load(open(hf_hub_download("psaegert/simplipy-assets", "manifest.json", repo_type="dataset")))
          cache = os.path.expanduser("~/.cache/simplipy")
          for name in ("acj-4", "acj-4-3"):
              info = manifest[name]
              for f in info["files"]:
                  hf_hub_download(repo_id=info["repo_id"], filename=f"{info['directory']}/{f}", repo_type="dataset", local_dir=cache)
              print("staged", name, "->", os.path.join(cache, info["directory"]))
          PY
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy
        if: always()  # a red rustfmt must never mask the substantive gates (R1/X1c)
        run: cargo clippy --lib --all-features
      # REQUIRE_ASSETS: ~half the Rust suite is gated on this asset and self-skips (green, no-op)
      # when it is absent -- so a silently broken staging step would thin the suite to nothing.
      # With the variable set, a missing asset panics the gated tests instead.
      - name: cargo test (asset staged above, and required loudly)
        if: always()
        run: cargo test --lib
        env:
          SIMPLIPY_TEST_REQUIRE_ASSETS: "1"
      - name: cargo-deny (supply-chain / license / advisory gate)
        if: always()
        uses: EmbarkStudios/cargo-deny-action@v2
