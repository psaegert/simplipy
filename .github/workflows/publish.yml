# Build cross-platform maturin wheels + sdist and publish to PyPI when a GitHub Release is published.
# abi3-py311 -> ONE wheel per (platform, arch) covers CPython >= 3.11.

name: Upload Python Package

on:
  release:
    types: [published]
  workflow_dispatch:        # allow a manual dry-run (build artifacts only; publish job is release-gated)

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.platform.runner }} ${{ matrix.platform.target }})
    # Only the public release repo builds or publishes. PyPI's trusted-publisher binding
    # already rejects an upload from anywhere else, but it lives OUTSIDE this file and a
    # repository RENAME would satisfy a `github.repository == 'psaegert/simplipy'` check
    # while the numeric id cannot be moved (audit L8 / D18). This also stops a
    # workflow_dispatch dry-run in the private repo from uploading a private-source
    # tarball as a downloadable Actions artifact.
    if: github.repository_id == '996264689'
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # smoke: import the built wheel on the runner (X15) — only where the
          # runner's own architecture can execute it; cross-compiled targets skip.
          - { runner: ubuntu-latest,   target: x86_64,  smoke: true }
          - { runner: ubuntu-latest,   target: aarch64, smoke: false }
          - { runner: macos-latest,    target: x86_64,  smoke: false }  # cross-compiled on the arm64 runner (macos-13 Intel runners are retired)
          - { runner: macos-latest,    target: aarch64, smoke: true }
          - { runner: windows-latest,  target: x64,     smoke: true }
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: "true"
          manylinux: auto
      - name: Import smoke (X15)
        if: matrix.platform.smoke
        shell: python
        run: |
          import glob, subprocess, sys
          wheel = glob.glob('dist/*.whl')[0]
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', wheel])
          # The X15 class is an import-time failure on a non-dev platform (the
          # Windows SIGALRM AttributeError shipped exactly this way once). The
          # smoke needs no artifact: import, touch the compiled core, exercise a
          # pure helper.
          subprocess.check_call([sys.executable, '-c',
              'import simplipy, simplipy._core; '
              'assert simplipy.__version__; '
              'print("import smoke OK", simplipy.__version__)'])
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: dist

  build-sdist:
    name: Build sdist
    if: github.repository_id == '996264689'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  sdist-boundary:
    name: sdist disclosure boundary
    if: github.repository_id == '996264689'
    runs-on: ubuntu-latest
    needs: build-sdist
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Retrieve the sdist
        uses: actions/download-artifact@v4
        with:
          name: wheels-sdist
          path: dist
      - name: No private path ships, and every allowlisted artifact does
        run: python .github/check_sdist_boundary.py dist/*.tar.gz

  pypi-publish:
    name: Publish release to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist, sdist-boundary]
    if: github.repository_id == '996264689' && github.event_name == 'release'
    permissions:
      id-token: write        # mandatory for trusted publishing
    environment:
      name: pypi
      url: https://pypi.org/p/simplipy
    steps:
      - name: Retrieve distributions
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        # mech-5/X1c: pinned to a COMMIT SHA, not the floating `release/v1` tag -- the
        # publish step runs with the id-token that mints our PyPI trust, so a moved tag
        # on the upstream action is a supply-chain injection at the most sensitive
        # moment. The comment records what the SHA was when pinned (release/v1 head,
        # resolved 2026-08-15); bump deliberately, never by float.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1 @ 2026-08-15
        with:
          packages-dir: dist/
          # PEP 740 attestations, EXPLICIT rather than inherited from the action's
          # floating default: the artifact identity story (R6) extends to PyPI --
          # provenance is a claim we state, not a default we happen to receive.
          attestations: true
