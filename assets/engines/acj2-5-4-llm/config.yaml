  # The operators added in 0.15. Each renders as a call, so its precedence is never read;
  # sympy's spellings (`ceiling`, `Max`, `Min`, `Mod`) and numpy/scipy's (`arctan2`, `jv`)
  # read as aliases. max and min are commutative, but `commutative: true` is reserved for the
  # AC bags `+` and `*`, so their commutativity is the engine's law, not a config flag.
