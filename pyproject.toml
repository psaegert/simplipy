[project]
name = "simplipy"
description = "Efficient Simplification of Mathematical Expressions"
authors = [
    {name = "Paul Saegert"},
    ]
readme = "README.md"
requires-python = ">=3.12"
version = "0.14.0"
license = "MIT"
license-files = ["LICEN[CS]E*"]
keywords = ["symbolic-regression", "simplification", "expression", "prefix", "rewriting", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
# The INLINE phase (simplify + conversions + validation) is the compiled Rust `simplipy._core`;
# the OFFLINE phase (rule mining) stays pure Python. numpy/mpmath/scipy are offline-only at
# runtime (mining + sort promotion), huggingface_hub powers asset resolution, platformdirs
# resolves the asset cache directory.
#
# FLOORS, and what they are NOT. Every bound below is a floor we have reason to state; none
# is a tested minimum, and there are deliberately no ceilings (a ceiling that is not measured
# ages into a false constraint). The numpy floor is the load-bearing one: NEP 50 (numpy 2.0)
# changed scalar promotion, and the deployed evaluation path's f64 semantics are what the
# equivalence contract is stated against -- below 2.0 the promotion rules differ.
#
# PYTHON >= 3.12 (D35, owner-resolved 2026-08-16): numpy 2.5.2 and scipy 1.18.0 both
# declare >=3.12, so a 3.11 environment silently resolved an OLDER numeric stack than
# every developer and every other CI job -- a real difference in the f64 algebra the
# equivalence contract is stated against. The floor now matches the dependency
# reality. Standing policy (owner, same ruling): prefer NEW BUT STABLE versions;
# floors stay reasoned floors, no unmeasured ceilings.
dependencies = [
    "filelock>=3.12",
    "huggingface_hub>=0.30",
    "mpmath>=1.3",
    "numpy>=2.0",
    "platformdirs>=4.0",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "tqdm>=4.65",
]

[project.urls]
Homepage = "https://github.com/psaegert/simplipy"
Issues = "https://github.com/psaegert/simplipy/issues"
PyPI = "https://pypi.org/project/simplipy/"
ReadtheDocs = "https://simplipy.readthedocs.io/"

[project.scripts]
simplipy = "simplipy.__main__:main"

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "mypy",
    "flake8",
    "types-tqdm",
    "types-PyYAML",
    "mkdocs",
    "mkdocs-material",
    "mkdocs-autorefs",
    "mkdocstrings",
    "mkdocs-get-deps",
    "mkdocs-material-extensions",
    "mkdocstrings-python"
]
torch = [
    "torch>=1.0.0"
]

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
# Mixed layout: Python package at src/simplipy/ (unchanged src-layout); the compiled inline core is
# placed at simplipy/_core. The Rust crate lives under rust/ (Cargo.toml [lib] path = "rust/lib.rs").
python-source = "src"
module-name = "simplipy._core"
features = ["pyo3/extension-module"]
# The sdist ships what building and testing the package needs. Of the tracked mining
# workspace (remine/) that is exactly the acj artifact family the test suites load
# (config.yaml, mine.yaml, rules.json and its provenance sidecar); the harness scripts,
# their result records, the campaign documents, the specification, the mine logs and
# every superseded interim artifact stay out. A PyPI upload is irrevocable and mirrored,
# so this list is a disclosure boundary, not a packaging preference.
#
# THE BOUNDARY IS ASSERTED BY A TEST, NOT BY THESE GLOBS (audit R4/B15). The old list
# denied by extension at a single level (`remine/*.py`, `remine/*.json`) while allowing
# recursion elsewhere, so every other extension and every deeper directory fell through:
# measured 2026-08-15, the sdist carried 491 remine/ entries at 19.2 MB (439 of them the
# private pre-release audit corpus). A deny-everything/allow-twelve list cannot regress
# that way -- a new file under remine/ is out by default, forever.
#
# The twelve shippable artifact files (three acj cells x {config, mine spec, rules,
# provenance sidecar}) live at their PUBLIC home `assets/engines/` since 0.13.0 -- the
# curated public tree must build the same sdist as the private tree, so nothing the
# sdist needs may live under a private-tier path (found at the 0.13.0 cut: the boundary
# guard refused the public-built sdist for exactly this). The sdist-guard job in
# publish.yml asserts BOTH halves on every build: no remine/design path ships, and none
# of the twelve is missing.
exclude = [
    "design/**",
    "remine/**",
]



[tool.flake8]
ignore = ["E501", "W503"]
exclude = [
    ".git",
	"__pycache__",
	"build",
	"target",
	"venv",
	".venv",
	"env",
	".env",
]
# The promotion subpackage is a faithful, logic-exact port of an external ratified
# soundness certifier; its numeric style (short names, inline statements) is preserved
# verbatim so the port cannot drift from the reference. Only style codes are relaxed.
per-file-ignores = [
    "__init__.py:F401",
    "src/simplipy/promotion/*:E741,E702,E731,E126,E127,E128,E131,E122,F401,F841",
]


[tool.mypy]
no_implicit_optional = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
explicit_package_bases = true
# The promotion subpackage is a verbatim port of external numeric code; annotating its
# ~80 helper functions would edit ratified logic, so it is excluded from strict typing.
exclude = "(.venv|tests/|dev/|src/simplipy/promotion/)"
ignore_missing_imports = true

# The promotion subpackage is a verbatim port of external numeric code; annotating its
# ~80 helper functions would edit ratified logic, so its errors are ignored even when
# reached via an import from the typed engine.
[[tool.mypy.overrides]]
module = "simplipy.promotion.*"
ignore_errors = true


[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests",
]
