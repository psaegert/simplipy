[project]
name = "simplipy"
description = "Efficient Simplification of Mathematical Expressions"
authors = [
    {name = "Paul Saegert"},
    ]
readme = "README.md"
requires-python = ">=3.11"
version = "0.12.0"
license = "MIT"
license-files = ["LICEN[CS]E*"]
keywords = ["symbolic-regression", "simplification", "expression", "prefix", "rewriting", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
# The INLINE phase (simplify + conversions + validation) is the compiled Rust `simplipy._core`;
# the OFFLINE phase (rule mining) stays pure Python. numpy/mpmath/scipy are offline-only at
# runtime (mining + sort promotion), huggingface_hub powers asset resolution, platformdirs
# resolves the asset cache directory.
dependencies = [
    "filelock",
    "huggingface_hub",
    "mpmath",
    "numpy",
    "platformdirs",
    "pyyaml",
    "scipy",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/psaegert/simplipy"
Issues = "https://github.com/psaegert/simplipy/issues"
PyPI = "https://pypi.org/project/simplipy/"
ReadtheDocs = "https://simplipy.readthedocs.io/"

[project.scripts]
simplipy = "simplipy.__main__:main"

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "mypy",
    "flake8",
    "pygount",
    "types-tqdm",
    "types-toml",
    "types-PyYAML",
    "radon",
    "mkdocs",
    "mkdocs-material",
    "mkdocs-autorefs",
    "mkdocstrings",
    "mkdocs-get-deps",
    "mkdocs-material-extensions",
    "mkdocstrings-python"
]
torch = [
    "torch>=1.0.0"
]

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
# Mixed layout: Python package at src/simplipy/ (unchanged src-layout); the compiled inline core is
# placed at simplipy/_core. The Rust crate lives under rust/ (Cargo.toml [lib] path = "rust/lib.rs").
python-source = "src"
module-name = "simplipy._core"
features = ["pyo3/extension-module"]
# The sdist ships what building and testing the package needs. Of the tracked mining
# workspace (remine/) that is exactly the acj artifact family the test suites load
# (config.yaml, mine.yaml, rules.json and its provenance sidecar); the mining and
# verification harness scripts, their result records, the campaign documents, the
# specification, the mine logs, and superseded interim artifacts all stay out.
#
# The prose-file exclusions are NOT cosmetic. Without them the sdist carried the
# campaign register, the release-train TODO, four internal audits and the normative
# contract -- 30 remine/ files, verified by building the sdist and listing it. A PyPI
# upload is irrevocable and mirrored, so this list is a disclosure boundary, not a
# packaging preference. VERIFY BY BUILDING, never by reading the globs:
#     python -m maturin sdist -o dist/ && tar tzf dist/*.tar.gz | grep remine/
exclude = [
    "design/**",
    "remine/d9/**",
    "remine/nv-2-1/**",
    "remine/nv-3-2/**",
    "remine/nv-4-3/**",
    "remine/2-1/**",
    "remine/3-2/**",
    "remine/4-3/**",
    "remine/*.py",
    "remine/*.json",
    "remine/**/*.md",
    "remine/**/*.log",
    "remine/spec/**",
]


[tool.flake8]
ignore = ["E501", "W503"]
exclude = [
    ".git",
	"__pycache__",
	"build",
	"target",
	"venv",
	".venv",
	"env",
	".env",
]
# The promotion subpackage is a faithful, logic-exact port of an external ratified
# soundness certifier; its numeric style (short names, inline statements) is preserved
# verbatim so the port cannot drift from the reference. Only style codes are relaxed.
per-file-ignores = [
    "__init__.py:F401",
    "src/simplipy/promotion/*:E741,E702,E731,E126,E127,E128,E131,E122,F401,F841",
]


[tool.mypy]
no_implicit_optional = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
explicit_package_bases = true
# The promotion subpackage is a verbatim port of external numeric code; annotating its
# ~80 helper functions would edit ratified logic, so it is excluded from strict typing.
exclude = "(.venv|tests/|dev/|src/simplipy/promotion/)"
ignore_missing_imports = true

# The promotion subpackage is a verbatim port of external numeric code; annotating its
# ~80 helper functions would edit ratified logic, so its errors are ignored even when
# reached via an import from the typed engine.
[[tool.mypy.overrides]]
module = "simplipy.promotion.*"
ignore_errors = true


[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests",
    "invariance: engine-invariance property gates (commutative operand order). Some are known-failing xfail(strict=True) gates that document a defect; the accompanying ratchet tests are green and fire on regression. Run alone with `pytest -m invariance -rxX`.",
]
